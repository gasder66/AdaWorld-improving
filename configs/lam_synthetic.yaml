model:
  image_channels: 3

  lam_model_dim: 512
  lam_latent_dim: 32
  lam_patch_size: 16
  lam_enc_blocks: 8
  lam_dec_blocks: 8
  lam_num_heads: 8
  num_slots: 4
  use_slot_competition: true

  beta: 0.0002
  log_interval: 1000
  log_path: exp_imgs_synthetic
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 2.5e-5
      weight_decay: 1e-2

data:
  batch_size: 32
  data_root: .
  env_source: synthetic
  padding: repeat
  randomize: true
  resolution: 256
  num_frames: 2
  output_format: t h w c
  samples_per_epoch: 100000
  sampling_strategy: sample

trainer:
  max_epochs: 100
  accelerator: gpu
  num_nodes: 1
  devices: 0
  strategy: auto
  precision: 16-mixed
  log_every_n_steps: 100
  accumulate_grad_batches: 1
  gradient_clip_val: 0.3

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: exp_ckpts_synthetic
        verbose: true
        save_last: true
        save_top_k: -1

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: exp_logs_synthetic
        name: lam
